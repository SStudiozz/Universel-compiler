name: Melon Playground APK - Decompile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/melon-playground-decompile.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET for Il2CppDumper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install APK and IL2CPP tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools input output
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o tools/apktool.jar

          curl -fL https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip -o tools/Il2CppDumper.zip
          mkdir -p tools/il2cppdumper
          unzip -oq tools/Il2CppDumper.zip -d tools/il2cppdumper
          find tools/il2cppdumper -maxdepth 2 -type f -print

          curl -fL https://github.com/SamboyCoding/Cpp2IL/releases/download/2022.0.7/Cpp2IL-2022.0.7-Linux -o tools/Cpp2IL
          chmod +x tools/Cpp2IL

      - name: Download APK from this repository's latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'melon-sandbox-22-0-5.apk' --dir input
          test -s input/melon-sandbox-22-0-5.apk
          sha256sum input/melon-sandbox-22-0-5.apk | tee output/apk-sha256.txt

      - name: Decode Android resources and manifest
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f input/melon-sandbox-22-0-5.apk -o output/apktool
          unzip -l input/melon-sandbox-22-0-5.apk > output/apk-file-list.txt
          unzip -p input/melon-sandbox-22-0-5.apk AndroidManifest.xml > output/AndroidManifest.binary.xml

      - name: Extract IL2CPP binaries and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/il2cpp
          unzip -oq input/melon-sandbox-22-0-5.apk 'lib/*/libil2cpp.so' 'assets/bin/Data/Managed/Metadata/global-metadata.dat' -d output/il2cpp
          META=$(find output/il2cpp -name global-metadata.dat -print -quit)
          test -s "$META"
          find output/il2cpp -type f -printf '%p %s bytes\n' | tee output/il2cpp-inputs.txt

      - name: Run Il2CppDumper (ARM64)
        shell: bash
        run: |
          set -uo pipefail
          META=$(find output/il2cpp -name global-metadata.dat -print -quit)
          LIB=output/il2cpp/lib/arm64-v8a/libil2cpp.so
          test -s "$META"
          test -s "$LIB"
          DLL=$(find tools/il2cppdumper -maxdepth 2 -name 'Il2CppDumper.dll' -print -quit)
          test -n "$DLL"
          mkdir -p output/il2cppdumper-arm64

          # Il2CppDumper 6.7.46 generates its output and then calls Console.ReadKey.
          # In CI that final pause throws because stdin is not an interactive console.
          # Capture its exit code, then judge success by the actual generated files.
          set +e
          dotnet "$DLL" "$LIB" "$META" output/il2cppdumper-arm64 </dev/null
          DUMPER_STATUS=$?
          set -e
          echo "Il2CppDumper exit code: $DUMPER_STATUS"
          find output/il2cppdumper-arm64 -type f -printf '%p %s bytes\n' | tee output/il2cppdumper-inventory.txt
          test -n "$(find output/il2cppdumper-arm64 -type f -size +0c -print -quit)" || {
            echo "Il2CppDumper produced no usable files; treating this as a real failure."
            exit 1
          }
          if [ "$DUMPER_STATUS" -ne 0 ]; then
            echo "Ignoring the post-generation console-pause failure; generated output was verified."
          fi

      - name: Run Cpp2IL against the original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/cpp2il
          # Cpp2IL 2022.0.7's force options require ALL THREE values:
          # binary path, metadata path, and Unity version. Let its APK handler
          # extract the correct ARM64 binary + metadata and read Unity version
          # from globalgamemanagers instead of supplying an incomplete force set.
          tools/Cpp2IL --game-path="$PWD/input/melon-sandbox-22-0-5.apk" --output-root="$PWD/output/cpp2il" --analysis-level=4 --disable-registration-prompts --verbose 2>&1 | tee output/cpp2il.log
          test -n "$(find output/cpp2il -type f -size +0c -print -quit)"

      - name: Verify reconstructed output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Decompiled output inventory ===" | tee output/verification.txt
          find output/il2cppdumper-arm64 output/cpp2il -type f -size +0c -printf '%p %s bytes\n' | tee -a output/verification.txt
          test -n "$(find output/il2cppdumper-arm64 output/cpp2il -type f -size +0c -print -quit)"

      - name: Package analysis output
        if: always()
        shell: bash
        run: |
          mkdir -p output
          {
            echo "Melon Playground APK analysis"
            echo "APK: melon-sandbox-22-0-5.apk"
            echo "Build date: $(date -u +%FT%TZ)"
            echo "Cpp2IL and Il2CppDumper output is reconstructed metadata/IL, not the original Unity project or guaranteed original C# source."
          } > output/README.txt
          tar -czf melon-playground-decompile.tar.gz output

      - name: Publish decompilation archive to the existing public release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s melon-playground-decompile.tar.gz
          gh release upload Melon melon-playground-decompile.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload decompilation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melon-playground-decompile
          path: melon-playground-decompile.tar.gz
          if-no-files-found: error
          retention-days: 14
