name: Melon Phase 1 - Patch Pipeline PoC

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL of melon-sandbox-22-0-5.apk (must be publicly accessible)'
        required: true
        type: string
        default: 'https://drive.usercontent.google.com/download?id=1yC0Zn9wr_0jRltOHwqYns5jCXP5lDShb&export=download&confirm=t'

permissions:
  contents: write

concurrency:
  group: melon-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-poc:
    name: Phase 1 - Harmless PoC patch + rebuild + sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip p7zip-full 2>/dev/null || true
          # apktool
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          # uber-apk-signer
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download original APK
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.apk_url }}"
          echo "Downloading from: $URL"
          curl -L --fail --retry 3 --retry-delay 5 -o original.apk "$URL"
          ls -lh original.apk
          head -c 4 original.apk | od -A n -t x1
          EXPECTED_SHA="9d71ab33e2849bca17c8d37e77b299d3b62c13e10f94ebd7537c281449e034f5"
          ACTUAL_SHA=$(sha256sum original.apk | awk '{print $1}')
          echo "SHA256: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
            echo "SHA256 matches expected decompile input."
          else
            echo "WARNING: SHA256 does not match expected. Continuing for PoC."
          fi
          cp original.apk original-melon-sandbox-22-0-5.apk

      - name: Extract APK (robust method)
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          # Try 7z first (handles more compression methods), fall back to jar
          if command -v 7z >/dev/null 2>&1; then
            echo "Extracting with 7z..."
            7z x -y ../original.apk
          else
            echo "Extracting with jar..."
            jar xf ../original.apk
          fi
          echo "Extract done. Top-level:"
          ls -la
          test -d lib || test -d assets || { echo "Extract failed - no lib/assets"; exit 1; }

      - name: Inject PoC marker and rebuild
        run: |
          set -euo pipefail
          cd work
          mkdir -p assets
          MARKER="MELON_PATCH_PIPELINE_POC_v1 $(date -u +%Y%m%dT%H%M%SZ) commit=${{ github.sha }}"
          echo "$MARKER" > assets/melon_patch_poc.txt
          echo "Injected marker:"
          cat assets/melon_patch_poc.txt
          # Remove old signatures
          rm -rf META-INF
          # Rebuild as zip (stored then we can re-compress if needed)
          # Use jar for reliable APK-compatible packaging
          jar cf ../unsigned.apk .
          cd ..
          # Or zip -0 then zip -9 for better compatibility
          ls -lh unsigned.apk
          # Verify marker
          unzip -p unsigned.apk assets/melon_patch_poc.txt || jar xf unsigned.apk assets/melon_patch_poc.txt && cat assets/melon_patch_poc.txt

      - name: Generate keystore and sign
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US"
          # Prefer uber-apk-signer (handles align + sign + v1/v2/v3)
          java -jar /tmp/uber-apk-signer.jar -a unsigned.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite -o signed_out
          # Find the signed apk
          find signed_out -name "*.apk" -exec cp {} melon-pipeline-test.apk \;
          ls -lh melon-pipeline-test.apk
          sha256sum melon-pipeline-test.apk | tee melon-pipeline-test.apk.sha256

      - name: Verify final APK
        run: |
          set -euo pipefail
          echo "=== Marker inside final APK ==="
          unzip -p melon-pipeline-test.apk assets/melon_patch_poc.txt || true
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('melon-pipeline-test.apk')
          print(z.read('assets/melon_patch_poc.txt').decode())
          print('ZIP entries:', len(z.namelist()))
          "
          echo "PHASE1_POC_SUCCESS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melon-pipeline-test
          path: |
            melon-pipeline-test.apk
            melon-pipeline-test.apk.sha256
            original-melon-sandbox-22-0-5.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summary
        run: |
          echo "### Melon Phase 1 PoC completed" >> $GITHUB_STEP_SUMMARY
          echo "- Original APK backed up" >> $GITHUB_STEP_SUMMARY
          echo "- Harmless marker injected: assets/melon_patch_poc.txt" >> $GITHUB_STEP_SUMMARY
          echo "- APK rebuilt and signed with debug keystore" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: melon-pipeline-test" >> $GITHUB_STEP_SUMMARY
