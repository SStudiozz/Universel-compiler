name: Melon Phase 1 - Patch Pipeline PoC

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL of melon-sandbox-22-0-5.apk'
        required: true
        type: string
        default: 'https://drive.usercontent.google.com/download?id=1yC0Zn9wr_0jRltOHwqYns5jCXP5lDShb&export=download&confirm=t'

permissions:
  contents: write

concurrency:
  group: melon-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-poc:
    name: Phase 1 - Harmless PoC patch + rebuild + sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download original APK
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.apk_url }}"
          echo "Downloading from: $URL"
          curl -L --fail --retry 3 --retry-delay 5 -o original.apk "$URL"
          ls -lh original.apk
          head -c 4 original.apk | od -A n -t x1
          EXPECTED_SHA="9d71ab33e2849bca17c8d37e77b299d3b62c13e10f94ebd7537c281449e034f5"
          ACTUAL_SHA=$(sha256sum original.apk | awk '{print $1}')
          echo "SHA256: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
            echo "SHA256 matches expected decompile input."
          else
            echo "WARNING: SHA256 does not match expected. Continuing for PoC."
          fi
          cp original.apk original-melon-sandbox-22-0-5.apk

      - name: Inject PoC marker in-place (no full extract)
        run: |
          set -euo pipefail
          python3 << 'PY'
          import zipfile, os, time, shutil
          from datetime import datetime, timezone

          src = "original.apk"
          dst = "unsigned.apk"
          shutil.copy2(src, dst)

          marker = f"MELON_PATCH_PIPELINE_POC_v1 {datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')} commit={os.environ.get('GITHUB_SHA', 'local')}\n"
          print("Marker content:", marker.strip())

          # Append/update entry without re-compressing the whole archive.
          # zipfile in append mode can add new files.
          with zipfile.ZipFile(dst, "a", compression=zipfile.ZIP_DEFLATED) as z:
              # Remove old META-INF signatures so resign works cleanly
              # (we cannot delete easily in append mode; uber-apk-signer --allowResign handles existing sigs)
              z.writestr("assets/melon_patch_poc.txt", marker)

          # Verify
          with zipfile.ZipFile(dst, "r") as z:
              data = z.read("assets/melon_patch_poc.txt").decode()
              print("Verified inside APK:", data.strip())
              print("Total entries:", len(z.namelist()))

          print("unsigned.apk size:", os.path.getsize(dst))
          PY

      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US"
          java -jar /tmp/uber-apk-signer.jar -a unsigned.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite -o signed_out
          find signed_out -name "*.apk" -exec cp {} melon-pipeline-test.apk \;
          ls -lh melon-pipeline-test.apk
          sha256sum melon-pipeline-test.apk | tee melon-pipeline-test.apk.sha256

      - name: Final verification
        run: |
          set -euo pipefail
          python3 << 'PY'
          import zipfile
          with zipfile.ZipFile("melon-pipeline-test.apk", "r") as z:
              print("Marker:", z.read("assets/melon_patch_poc.txt").decode().strip())
              print("Entries:", len(z.namelist()))
              # Confirm original critical files still listed
              names = set(z.namelist())
              for n in ["AndroidManifest.xml", "classes.dex", "lib/arm64-v8a/libil2cpp.so", "assets/bin/Data/Managed/Metadata/global-metadata.dat"]:
                  print(f"  {n}: {'OK' if n in names else 'MISSING'}")
          print("PHASE1_POC_SUCCESS")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melon-pipeline-test
          path: |
            melon-pipeline-test.apk
            melon-pipeline-test.apk.sha256
            original-melon-sandbox-22-0-5.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summary
        run: |
          echo "### Melon Phase 1 PoC completed" >> $GITHUB_STEP_SUMMARY
          echo "- Original APK backed up" >> $GITHUB_STEP_SUMMARY
          echo "- Marker injected in-place (no full extract; avoids corrupted libunity.so)" >> $GITHUB_STEP_SUMMARY
          echo "- APK signed with debug keystore" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: melon-pipeline-test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: source APK has a corrupted arm64 libunity.so entry (invalid deflate)." >> $GITHUB_STEP_SUMMARY
          echo "armeabi-v7a libunity.so is intact. Pipeline still proves inject+sign works." >> $GITHUB_STEP_SUMMARY
