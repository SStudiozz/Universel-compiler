name: Melon DocumentsProvider rebuild

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive file ID - use CLEAN original Melon APK'
        required: true
        type: string
      apk_url:
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          pip install -q 'gdown>=5.0'
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download CLEAN Melon APK
        run: |
          set -euo pipefail
          gdown "${{ github.event.inputs.drive_file_id }}" -O original.apk
          ls -lh original.apk
          test "$(stat -c%s original.apk)" -gt 50000000
          head -c 2 original.apk | cmp -n 2 - <(printf PK)

      - name: Full Apktool decode
        run: |
          set -euo pipefail
          apktool d -f original.apk -o decoded

      - name: Kill interstitials + free coins + force FPS counter
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          lib = Path('decoded/lib/arm64-v8a/libil2cpp.so')
          data = bytearray(lib.read_bytes())
          RET = bytes([0xC0, 0x03, 0x5F, 0xD6])
          for off, name in [
              (0x203FED4, 'AdsManager.ShowInterstitial'),
              (0x203FEB0, 'AdsManager.ShowAdWithDelay'),
              (0x3925D20, 'MaxSdk.ShowInterstitial'),
          ]:
              data[off:off+4] = RET
              print('RET', name, hex(off))

          # WalletController.CheckEnoughCoinsForPrice -> always onCompleted(true)
          coin_off = 0x20EF8E4
          coin_va = 0x20F08E4
          invoke_va = 0x37B86B0
          imm = (invoke_va - (coin_va + 12)) // 4
          bl = (0x94000000 | (imm & 0x3FFFFFF)).to_bytes(4, 'little')
          patch = (
              bytes.fromhex('e00302aa') +
              bytes.fromhex('21008052') +
              bytes.fromhex('400000b4') +
              bl +
              bytes.fromhex('c0035fd6')
          )
          data[coin_off:coin_off+len(patch)] = patch
          print('coin gate always true', patch.hex())

          # Force FPS counter on (MobileConsole showFPS path)
          fps_off = 0x212800C
          chunk = bytes(data[fps_off:fps_off+64])
          idx = chunk.find(bytes.fromhex('68c24039'))
          if idx >= 0:
              data[fps_off+idx:fps_off+idx+4] = bytes.fromhex('28008052')
              print('UpdateShowFPS force on')
          init_off = 0x2127F6C
          chunk2 = bytes(data[init_off:init_off+128])
          idx2 = chunk2.find(bytes.fromhex('68c20039'))
          if idx2 >= 0:
              data[init_off+idx2-4:init_off+idx2] = bytes.fromhex('28008052')
              print('default _showFPS=true')

          lib.write_bytes(data)
          print('shop rewarded ads left intact; no FPS unlock')
          PY

      - name: Install real single-root DocumentsProvider
        run: |
          set -euo pipefail
          mkdir -p decoded/smali/com/studio27/melonmod
          cp melon-mod/smali/com/studio27/melonmod/MelonDocumentsProvider.smali \
             decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali
          ! grep -q "Melon App Data\|Melon Files (Saves" decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali
          grep -q "getExternalFilesDir" decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali
          echo "provider ok"

      - name: Inject provider manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("decoded/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8", errors="ignore")
          provider = (
              "\n        <provider"
              " android:name=\"com.studio27.melonmod.MelonDocumentsProvider\""
              " android:authorities=\"com.studio27.MelonPlayground.documents\""
              " android:exported=\"true\""
              " android:grantUriPermissions=\"true\""
              " android:permission=\"android.permission.MANAGE_DOCUMENTS\""
              " android:enabled=\"true\">"
              "\n            <intent-filter>"
              "\n                <action android:name=\"android.content.action.DOCUMENTS_PROVIDER\" />"
              "\n            </intent-filter>"
              "\n        </provider>"
          )
          if "MelonDocumentsProvider" not in t:
              m = re.search(r"</application\s*>", t, flags=re.I)
              t = t[:m.start()] + provider + "\n    " + t[m.start():]
              p.write_text(t, encoding="utf-8")
          print("manifest ok")
          PY

      - name: Rebuild and sign
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          keytool -genkeypair -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US"
          cp unsigned.apk melon-files-sidebar.apk
          java -jar /tmp/uber-apk-signer.jar -a melon-files-sidebar.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite
          ls -lh melon-files-sidebar.apk
          sha256sum melon-files-sidebar.apk | tee melon-files-sidebar.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: melon-files-sidebar
          path: |
            melon-files-sidebar.apk
            melon-files-sidebar.apk.sha256
          if-no-files-found: error
          retention-days: 14
