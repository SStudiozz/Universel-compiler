name: Melon DocumentsProvider + AdKill rebuild

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to Melon APK (prefer adkill or clean 22.0.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APK
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o original.apk "${{ github.event.inputs.apk_url }}"
          ls -lh original.apk
          head -c 4 original.apk | od -A n -t x1

      - name: Decode APK (full, for readable manifest)
        run: |
          set -euo pipefail
          # Full decode so AndroidManifest is XML text
          apktool d -f original.apk -o decoded
          test -f decoded/AndroidManifest.xml
          echo "=== manifest head ==="
          head -40 decoded/AndroidManifest.xml
          echo "=== application tags ==="
          grep -n "application" decoded/AndroidManifest.xml | head -20

      - name: Write DocumentsProvider smali (multi-root: files + saves/mods)
        run: |
          set -euo pipefail
          mkdir -p decoded/smali/com/studio27/melonmod
          cat > decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali << 'EOF'
