name: Melon DocumentsProvider rebuild

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive file ID of Melon APK (adkill preferred)'
        required: true
        type: string
      apk_url:
        description: 'unused'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          pip install -q 'gdown>=5.0'
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APK via gdown
        run: |
          set -euo pipefail
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          gdown "$FILE_ID" -O original.apk
          ls -lh original.apk
          SIZE=$(stat -c%s original.apk)
          test "$SIZE" -gt 50000000 || exit 1
          head -c 2 original.apk | cmp -n 2 - <(printf PK) || exit 1

      - name: Full Apktool decode
        run: |
          set -euo pipefail
          apktool d -f original.apk -o decoded
          test -f decoded/AndroidManifest.xml

      - name: Apply libil2cpp rewarded + interstitial policy
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          lib = Path('decoded/lib/arm64-v8a/libil2cpp.so')
          if not lib.exists():
              raise SystemExit(f'missing {lib}')
          data = bytearray(lib.read_bytes())
          RET = bytes([0xC0,0x03,0x5F,0xD6])
          TRUE = bytes([0x20,0x00,0x80,0x52, 0xC0,0x03,0x5F,0xD6])
          shell = bytes.fromhex('2100805201e40039003c40f9400000b427b66814c0035fd6')
          off_show = 0x203F998
          off_avail = 0x203F4E4
          for off in [0x203FED4, 0x203FEB0, 0x3925D20]:
              if off+4 <= len(data):
                  data[off:off+4] = RET
                  print(f'RET interstitial @ {off:#x}')
          data[off_avail:off_avail+8] = TRUE
          print(f'isRewarded true @ {off_avail:#x}')
          data[off_show:off_show+len(shell)] = shell
          print(f'ShowRewarded shell @ {off_show:#x}')
          for off in [0x392708C, 0x39279FC]:
              if off+4 <= len(data):
                  data[off:off+4] = RET
                  print(f'RET MaxSdk rewarded @ {off:#x}')
          lib.write_bytes(data)
          print('libil2cpp patched', lib.stat().st_size)
          PY

      - name: Install DocumentsProvider smali
        run: |
          set -euo pipefail
          mkdir -p decoded/smali/com/studio27/melonmod
          cp melon-mod/smali/com/studio27/melonmod/MelonDocumentsProvider.smali \
             decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali
          grep -E "queryRoots|mPkg|mExt" decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali | head

      - name: Inject provider into AndroidManifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("decoded/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8", errors="ignore")
          provider = (
              "\n        <provider"
              " android:name=\"com.studio27.melonmod.MelonDocumentsProvider\""
              " android:authorities=\"com.studio27.MelonPlayground.documents\""
              " android:exported=\"true\""
              " android:grantUriPermissions=\"true\""
              " android:permission=\"android.permission.MANAGE_DOCUMENTS\""
              " android:enabled=\"true\">"
              "\n            <intent-filter>"
              "\n                <action android:name=\"android.content.action.DOCUMENTS_PROVIDER\" />"
              "\n            </intent-filter>"
              "\n        </provider>"
          )
          if "MelonDocumentsProvider" not in t:
              m = re.search(r"</application\s*>", t, flags=re.I)
              if not m:
                  raise SystemExit("no application end")
              t = t[:m.start()] + provider + "\n    " + t[m.start():]
              p.write_text(t, encoding="utf-8")
          assert "MelonDocumentsProvider" in p.read_text(encoding="utf-8")
          print("manifest OK")
          PY

      - name: Rebuild APK
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          ls -lh unsigned.apk

      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US"
          cp unsigned.apk melon-files-sidebar.apk
          java -jar /tmp/uber-apk-signer.jar -a melon-files-sidebar.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite
          ls -lh melon-files-sidebar.apk
          sha256sum melon-files-sidebar.apk | tee melon-files-sidebar.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: melon-files-sidebar
          path: |
            melon-files-sidebar.apk
            melon-files-sidebar.apk.sha256
          if-no-files-found: error
          retention-days: 14
