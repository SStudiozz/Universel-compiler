name: Melon DocumentsProvider rebuild

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct HTTP URL OR Google Drive file id'
        required: true
        type: string
      drive_file_id:
        description: 'Optional Google Drive file ID (preferred over apk_url for Drive files)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          pip install -q gdown
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APK
        run: |
          set -euo pipefail
          FILE_ID="${{ github.event.inputs.drive_file_id }}"
          URL="${{ github.event.inputs.apk_url }}"
          if [ -n "$FILE_ID" ]; then
            echo "Downloading Drive file id=$FILE_ID via gdown"
            gdown --fuzzy "https://drive.google.com/uc?id=${FILE_ID}" -O original.apk
          elif echo "$URL" | grep -q "drive.google.com\|drive.usercontent"; then
            echo "Downloading Drive URL via gdown"
            gdown --fuzzy "$URL" -O original.apk
          else
            curl -L --fail --retry 3 -o original.apk "$URL"
          fi
          ls -lh original.apk
          SIZE=$(stat -c%s original.apk)
          echo "size=$SIZE"
          test "$SIZE" -gt 50000000 || { echo "APK too small - download failed"; head -c 200 original.apk; exit 1; }
          head -c 4 original.apk | od -A n -t x1
          # must be ZIP/APK magic PK
          head -c 2 original.apk | grep -q PK || { echo "not a zip/apk"; exit 1; }

      - name: Full Apktool decode
        run: |
          set -euo pipefail
          apktool d -f original.apk -o decoded
          test -f decoded/AndroidManifest.xml
          head -50 decoded/AndroidManifest.xml
          grep -n -i "application" decoded/AndroidManifest.xml | head -20

      - name: Install DocumentsProvider smali from repo
        run: |
          set -euo pipefail
          mkdir -p decoded/smali/com/studio27/melonmod
          cp melon-mod/smali/com/studio27/melonmod/MelonDocumentsProvider.smali \
             decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali
          wc -l decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali
          grep -E "queryRoots|queryChildDocuments|queryDocument|openDocument|onCreate" \
            decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali

      - name: Inject provider into AndroidManifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("decoded/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8", errors="ignore")
          print("manifest bytes", len(t))
          provider = (
              "\n        <provider"
              " android:name=\"com.studio27.melonmod.MelonDocumentsProvider\""
              " android:authorities=\"com.studio27.MelonPlayground.documents\""
              " android:exported=\"true\""
              " android:grantUriPermissions=\"true\""
              " android:permission=\"android.permission.MANAGE_DOCUMENTS\""
              " android:enabled=\"true\">"
              "\n            <intent-filter>"
              "\n                <action android:name=\"android.content.action.DOCUMENTS_PROVIDER\" />"
              "\n            </intent-filter>"
              "\n        </provider>"
          )
          if "MelonDocumentsProvider" in t:
              print("provider already present")
          else:
              m = re.search(r"</application\s*>", t, flags=re.I)
              if not m:
                  print(t[:3000])
                  raise SystemExit("no </application> tag after full decode")
              t = t[: m.start()] + provider + "\n    " + t[m.start() :]
              p.write_text(t, encoding="utf-8")
              print("provider injected at", m.start())
          t2 = p.read_text(encoding="utf-8")
          assert "MelonDocumentsProvider" in t2
          assert "com.studio27.MelonPlayground.documents" in t2
          assert "android.content.action.DOCUMENTS_PROVIDER" in t2
          print("manifest provider OK")
          PY
          grep -n "MelonDocumentsProvider\|DOCUMENTS_PROVIDER\|MelonPlayground.documents" decoded/AndroidManifest.xml

      - name: Rebuild APK
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          ls -lh unsigned.apk
          unzip -t unsigned.apk | tail -5

      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US"
          cp unsigned.apk melon-files-sidebar.apk
          java -jar /tmp/uber-apk-signer.jar -a melon-files-sidebar.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite
          ls -lh melon-files-sidebar.apk
          sha256sum melon-files-sidebar.apk | tee melon-files-sidebar.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: melon-files-sidebar
          path: |
            melon-files-sidebar.apk
            melon-files-sidebar.apk.sha256
          if-no-files-found: error
          retention-days: 14
