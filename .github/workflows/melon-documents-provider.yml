      - name: Inject provider into AndroidManifest
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("decoded/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8", errors="ignore")
          print("manifest length", len(t))
          print("has application", "application" in t.lower())
          provider = '''
                  <provider android:name="com.studio27.melonmod.MelonDocumentsProvider" android:authorities="com.studio27.MelonPlayground.documents" android:exported="true" android:grantUriPermissions="true" android:permission="android.permission.MANAGE_DOCUMENTS">
                      <intent-filter>
                          <action android:name="android.content.action.DOCUMENTS_PROVIDER" />
                      </intent-filter>
                  </provider>'''
          if "MelonDocumentsProvider" in t:
              print("already present")
          elif re.search(r"</application>", t, re.I):
              t = re.sub(r"</application>", provider + "\n    </application>", t, count=1, flags=re.I)
              p.write_text(t, encoding="utf-8")
              print("injected before </application>")
          else:
              # show snippet for debug
              print(t[:2000])
              raise SystemExit("Could not find </application> in manifest")
          PY
          grep -n "MelonDocumentsProvider" decoded/AndroidManifest.xml

      - name: Rebuild APK
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          ls -lh unsigned.apk

      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US"
          cp unsigned.apk melon-files-sidebar.apk
          java -jar /tmp/uber-apk-signer.jar -a melon-files-sidebar.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite
          ls -lh melon-files-sidebar.apk
          sha256sum melon-files-sidebar.apk | tee melon-files-sidebar.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: melon-files-sidebar
          path: |
            melon-files-sidebar.apk
            melon-files-sidebar.apk.sha256
          retention-days: 14
