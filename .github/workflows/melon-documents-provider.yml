name: Melon DocumentsProvider rebuild

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive file ID - CLEAN original Melon APK'
        required: false
        default: ''
        type: string
      apk_url:
        description: 'Direct APK URL (optional, preferred if set)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          pip install -q 'gdown>=5.0'
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download CLEAN Melon APK
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.apk_url }}"
          FID="${{ github.event.inputs.drive_file_id }}"
          if [ -n "$URL" ]; then
            wget -q -O original.apk "$URL" || curl -L --fail -o original.apk "$URL"
          elif [ -n "$FID" ]; then
            gdown --fuzzy "https://drive.google.com/uc?id=${FID}" -O original.apk \
              || gdown "$FID" -O original.apk \
              || gdown "https://drive.google.com/file/d/${FID}/view" -O original.apk
          else
            echo "Need drive_file_id or apk_url"; exit 1
          fi
          ls -lh original.apk
          test "$(stat -c%s original.apk)" -gt 50000000

      - name: Full Apktool decode
        run: |
          set -euo pipefail
          apktool d -f original.apk -o decoded

      - name: Native IL2CPP patches
        run: |
          set -euo pipefail
          python3 melon-mod/native_patch.py

      - name: Build libmelonres.so (JNI resolution)
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -shared -fPIC -O2 -o libmelonres.so melon-mod/jni/melonres.c -llog
          ls -la libmelonres.so
          mkdir -p decoded/lib/arm64-v8a
          cp libmelonres.so decoded/lib/arm64-v8a/libmelonres.so
          echo "libmelonres.so installed"

      - name: Install smali mods
        run: |
          set -euo pipefail
          mkdir -p decoded/smali/com/studio27/melonmod
          cp melon-mod/smali/com/studio27/melonmod/MelonDocumentsProvider.smali decoded/smali/com/studio27/melonmod/
          cp melon-mod/smali/com/studio27/melonmod/MelonResOverlay.smali decoded/smali/com/studio27/melonmod/
          cp melon-mod/smali/com/studio27/melonmod/MelonResOverlay\$1.smali decoded/smali/com/studio27/melonmod/
          cp melon-mod/smali/com/studio27/melonmod/MelonResOverlay\$2.smali decoded/smali/com/studio27/melonmod/
          python3 melon-mod/hook_fps_activity.py
          echo "DocumentsProvider + ResOverlay installed"

      - name: Inject provider manifest
        run: |
          set -euo pipefail
          python3 melon-mod/inject_manifest.py

      - name: Rebuild and sign
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          keytool -genkeypair -keystore debug.keystore -alias melonpoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MelonPoC, OU=Dev, O=MelonMod, L=None, ST=None, C=US" || true
          cp unsigned.apk melon-files-sidebar.apk
          java -jar /tmp/uber-apk-signer.jar -a melon-files-sidebar.apk --ks debug.keystore \
            --ksAlias melonpoc --ksPass android --ksKeyPass android \
            --allowResign --overwrite
          ls -lh melon-files-sidebar.apk
          sha256sum melon-files-sidebar.apk | tee melon-files-sidebar.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: melon-files-sidebar
          path: |
            melon-files-sidebar.apk
            melon-files-sidebar.apk.sha256
          if-no-files-found: error
          retention-days: 14
