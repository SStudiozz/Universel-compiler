name: Melon DocumentsProvider + AdKill rebuild

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to clean Melon 22.0.5 APK'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip 2>/dev/null || true
          wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x /usr/local/bin/apktool
          wget -q -O /tmp/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APK
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o original.apk "${{ github.event.inputs.apk_url }}"
          ls -lh original.apk

      - name: Decode APK (no-res for speed)
        run: |
          set -euo pipefail
          apktool d -f -r original.apk -o decoded
          test -f decoded/AndroidManifest.xml
          ls decoded | head

      - name: Inject DocumentsProvider smali + manifest
        run: |
          set -euo pipefail
          mkdir -p decoded/smali/com/studio27/melonmod
          cat > decoded/smali/com/studio27/melonmod/MelonDocumentsProvider.smali << 'SMALI'
          .class public Lcom/studio27/melonmod/MelonDocumentsProvider;
          .super Landroid/provider/DocumentsProvider;
          .source "MelonDocumentsProvider.java"

          .field private static final AUTHORITY:Ljava/lang/String; = "com.studio27.MelonPlayground.documents"
          .field private static final ROOT_ID:Ljava/lang/String; = "melon_root"
          .field private mRootDir:Ljava/io/File;

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Landroid/provider/DocumentsProvider;-><init>()V
              return-void
          .end method

          .method public onCreate()Z
              .locals 3
              invoke-virtual {p0}, Lcom/studio27/melonmod/MelonDocumentsProvider;->getContext()Landroid/content/Context;
              move-result-object v0
              const/4 v1, 0x0
              invoke-virtual {v0, v1}, Landroid/content/Context;->getExternalFilesDir(Ljava/lang/String;)Ljava/io/File;
              move-result-object v1
              if-nez v1, :have_ext
              invoke-virtual {v0}, Landroid/content/Context;->getFilesDir()Ljava/io/File;
              move-result-object v1
              :have_ext
              iput-object v1, p0, Lcom/studio27/melonmod/MelonDocumentsProvider;->mRootDir:Ljava/io/File;
              invoke-virtual {v1}, Ljava/io/File;->exists()Z
              move-result v2
              if-nez v2, :done
              invoke-virtual {v1}, Ljava/io/File;->mkdirs()Z
              :done
              const/4 v2, 0x1
              return v2
          .end method

          .method public queryRoots([Ljava/lang/String;)Landroid/database/Cursor;
              .locals 5
              new-instance v0, Landroid/database/MatrixCursor;
              if-eqz p1, :def_cols
              array-length v1, p1
              if-nez v1, :use_p1
              :def_cols
              const/4 v1, 0x5
              new-array p1, v1, [Ljava/lang/String;
              const/4 v1, 0x0
              const-string v2, "root_id"
              aput-object v2, p1, v1
              const/4 v1, 0x1
              const-string v2, "flags"
              aput-object v2, p1, v1
              const/4 v1, 0x2
              const-string v2, "title"
              aput-object v2, p1, v1
              const/4 v1, 0x3
              const-string v2, "document_id"
              aput-object v2, p1, v1
              const/4 v1, 0x4
              const-string v2, "mime_types"
              aput-object v2, p1, v1
              :use_p1
              invoke-direct {v0, p1}, Landroid/database/MatrixCursor;-><init>([Ljava/lang/String;)V
              invoke-virtual {v0}, Landroid/database/MatrixCursor;->newRow()Landroid/database/MatrixCursor$RowBuilder;
              move-result-object v1
              const-string v2, "melon_root"
              invoke-virtual {v1, v2}, Landroid/database/MatrixCursor$RowBuilder;->add(Ljava/lang/Object;)Landroid/database/MatrixCursor$RowBuilder;
              const/16 v3, 0x13
              invoke-static {v3}, Ljava/lang/Integer;->valueOf(I)Ljava/lang/Integer;
              move-result-object v3
              invoke-virtual {v1, v3}, Landroid/database/MatrixCursor$RowBuilder;->add(Ljava/lang/Object;)Landroid/database/MatrixCursor$RowBuilder;
              const-string v3, "Melon Playground"
              invoke-virtual {v1, v3}, Landroid/database/MatrixCursor$RowBuilder;->add(Ljava/lang/Object;)Landroid/database/MatrixCursor$RowBuilder;
              invoke-virtual {v1, v2}, Landroid/database/MatrixCursor$RowBuilder;->add(Ljava/lang/Object;)Landroid/database/MatrixCursor$RowBuilder;
              const-string v3, "*/*"
              invoke-virtual {v1, v3}, Landroid/database/MatrixCursor$RowBuilder;->add(Ljava/lang/Object;)Landroid/database/MatrixCursor$RowBuilder;
              return-object v0
          .end method

